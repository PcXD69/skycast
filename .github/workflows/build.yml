name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org app.skycast --project-name skycast build_app
          cp "$GITHUB_WORKSPACE/pubspec.yaml" build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r "$GITHUB_WORKSPACE/lib" build_app/lib
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Skycast"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skycast-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
