name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q skycast.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        working-directory: src/skycast
        run: |
          flutter create --platforms=android --org app.skycast --project-name skycast build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          R=build_app/android/app/src/main/res
          rm -f $R/drawable-v21/launch_background.xml
          cp -r res/. $R/
          find $R -name styles.xml -exec sed -i 's#</style>#    <item name="android:statusBarColor">@android:color/transparent</item>\n    <item name="android:navigationBarColor">@android:color/transparent</item>\n  </style>#' {} +
          M=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Skycast"#' $M
      - name: Build
        working-directory: src/skycast/build_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: skycast-apk
          path: src/skycast/build_app/build/app/outputs/flutter-apk/app-release.apk
